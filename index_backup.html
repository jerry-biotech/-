// HELPER COMPUTATIONS
// ============================================================
function computeTargetStats() {
  var map = {};
  PIPELINES.forEach(function(p) {
    var t = p.target;
    if (!map[t]) {
      map[t] = { target: t, count: 0, peakMarket: 0, disease: p.disease, pipelines: [] };
    }
    map[t].count += 1;
    if (p.peakMarketB > map[t].peakMarket) map[t].peakMarket = p.peakMarketB;
    map[t].pipelines.push(p);
  });
  return Object.values(map);
}

var TARGET_STATS = computeTargetStats();

var DISEASE_COLORS = {
  '心血管': '#3b82f6',
  '罕见病': '#a855f7',
  '感染病': '#10b981',
  '神经退行': '#f59e0b',
  '肝脏代谢': '#f97316',
  '血液病': '#ef4444',
  '肿瘤': '#ec4899',
};

function stageClass(s) {
  if (s === '已获批') return 'stage-approved';
  if (s.indexOf('Ph3') > -1) return 'stage-ph3';
  if (s.indexOf('Ph2') > -1) return 'stage-ph2';
  if (s.indexOf('Ph1') > -1) return 'stage-ph1';
  return 'stage-preclinical';
}
function modalityClass(m) {
  if (m === 'siRNA') return 'modality-siRNA';
  if (m === 'ASO') return 'modality-ASO';
  if (m === 'miRNA') return 'modality-miRNA';
  if (m === 'mRNA') return 'modality-mRNA';
  return 'modality-其他';
}

    return e('th',{key:key,onClick:function(){thClick(key);},style:{padding:'8px 12px',textAlign:'left',fontSize:11,color:'#64748b',cursor:'pointer',userSelect:'none',whiteSpace:'nowrap',borderBottom:'1px solid #1e293b',background:'#0d1117'}},label+arrow);
  }

  return e('div',null,
    e('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}},
      e('div',{style:{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center'}},
        e('span',{style:{fontSize:11,color:'#64748b'}},'疾病：'),
        diseases.map(function(d){return e('button',{key:d,onClick:function(){setFilterDisease(d);},className:filterDisease===d?'tab-active':'tab-inactive',style:{border:'none',borderRadius:6,padding:'3px 10px',fontSize:11,cursor:'pointer'}},d);})
      ),
      e('div',{style:{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center',marginTop:4}},
        e('span',{style:{fontSize:11,color:'#64748b'}},'类型：'),
        modalities.map(function(m){return e('button',{key:m,onClick:function(){setFilterMod(m);},className:filterMod===m?'tab-active':'tab-inactive',style:{border:'none',borderRadius:6,padding:'3px 10px',fontSize:11,cursor:'pointer'}},m);})
      )
    ),
    e('div',{style:{overflowX:'auto',borderRadius:8,border:'1px solid #1e293b'}},
      e('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
        e('thead',null,
          e('tr',null,
            thEl('管线名称','name'),
            thEl('公司','company'),
            thEl('类型','modality'),
            thEl('靶点','target'),
            thEl('适应症','indication'),
            thEl('阶段','stage'),
            thEl('峰值市场','peakMarketB'),
            e('th',{key:'clin',style:{padding:'8px 12px',textAlign:'left',fontSize:11,color:'#38bdf8',whiteSpace:'nowrap',borderBottom:'1px solid #1e293b',background:'#0d1117'}},'📋 临床数据'),
          )
        ),
        e('tbody',null,
          filtered.map(function(p){
            var isExp = expRow === p.id;
            return [
              e('tr',{
                key:p.id,
                onClick:function(){
                  setExpRow(isExp ? null : p.id);
                  var ts=TARGET_STATS.find(function(x){return x.target===p.target;});
                  if(ts)onSelect(ts);
                },
                style:{cursor:'pointer',borderBottom:isExp?'none':'1px solid #1a2233',background:isExp?'#131929':'transparent'},
                className:'card-hover',
              },
                e('td',{style:{padding:'8px 12px',color:'#e2e8f0',fontWeight:'600',whiteSpace:'nowrap'}},p.name),
                e('td',{style:{padding:'8px 12px',color:'#94a3b8',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.company),
                e('td',{style:{padding:'8px 12px'}},e('span',{className:'stage-badge '+modalityClass(p.modality)},p.modality)),
                e('td',{style:{padding:'8px 12px',color:DISEASE_COLORS[p.disease]||'#94a3b8',fontWeight:'600'}},p.target),
                e('td',{style:{padding:'8px 12px',color:'#94a3b8',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.indication),
                e('td',{style:{padding:'8px 12px'}},e('span',{className:'stage-badge '+stageClass(p.stage)},p.stage)),
                e('td',{style:{padding:'8px 12px',color:'#4ade80',fontWeight:'600'}},'$'+p.peakMarketB+'B'),
                e('td',{style:{padding:'8px 12px',color:'#64748b',fontSize:11,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
                  e('span',{style:{color:'#38bdf840'}},isExp?'▲ 收起':'▼ 展开'),
                  e('span',{style:{marginLeft:6,color:'#475569'}},p.clinicalData.substring(0,40)+'…')
                )
              ),
              isExp ? e('tr',{key:p.id+'-exp',style:{borderBottom:'1px solid #1a2233'}},
                e('td',{colSpan:8,style:{padding:'0 16px 16px'}},
                  e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},
                    e('div',{className:'clinical-box'},
                      e('div',{style:{fontSize:10,fontWeight:'700',color:'#38bdf8',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}},'📋 临床数据'),
                      e('div',{style:{fontSize:12,color:'#94a3b8',lineHeight:1.7}},p.clinicalData)
                    ),
                    e('div',{style:{background:'#0d1520',border:'1px solid #3d2a00',borderRadius:8,padding:'10px 12px'}},
                      e('div',{style:{fontSize:10,fontWeight:'700',color:'#fbbf24',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}},'💡 分析师观点'),
                      e('div',{style:{fontSize:12,color:'#94a3b8',lineHeight:1.7}},p.analystView)
                    )
                  )
                )
              ) : null
            ];
          })
        )
      )
    ),
    e('div',{style:{marginTop:8,fontSize:11,color:'#475569'}},'显示 '+filtered.length+' / '+PIPELINES.length+' 条管线 · 点击行可展开临床数据')
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  var _sel = useState(null); var selected = _sel[0]; var setSelected = _sel[1];
  var _tab = useState('chart'); var tab = _tab[0]; var setTab = _tab[1];
  var _panel = useState(false); var panelOpen = _panel[0]; var setPanelOpen = _panel[1];

  function handleSelect(ts){ setSelected(ts); setPanelOpen(true); }
  var tabBtns = [{id:'chart',label:'📊 象限分布图'},{id:'table',label:'📋 管线数据库'}];

  return e('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column'}},
    e('header',{className:'header-gradient',style:{padding:'0 24px',height:58,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
      e('div',{style:{display:'flex',alignItems:'center',gap:12}},
        e('div',{style:{fontSize:22,lineHeight:1}},'🧬'),
        e('div',null,
          e('div',{style:{fontSize:16,fontWeight:'800',color:'#e2e8f0',letterSpacing:'-0.3px'}},'小核酸在研管线数据库'),
          e('div',{style:{fontSize:11,color:'#64748b'}},'Small Nucleic Acid Pipeline Intelligence · siRNA / ASO / miRNA')
        )
      ),
      e('div',{style:{display:'flex',gap:8,alignItems:'center'}},
        tabBtns.map(function(tb){
          return e('button',{key:tb.id,onClick:function(){setTab(tb.id);},className:tab===tb.id?'tab-active':'tab-inactive',style:{border:'none',borderRadius:8,padding:'6px 14px',fontSize:12,cursor:'pointer',fontWeight:'600'}},tb.label);
        })
      )
    ),
    e('div',{style:{flex:1,display:'flex',overflow:'hidden'}},
      e('div',{style:{flex:1,overflowY:'auto',padding:'20px 24px'}},
        e('div',{className:'card-bg rounded-xl p-4',style:{marginBottom:16,display:'flex',flexWrap:'wrap',gap:16,alignItems:'center',justifyContent:'space-between'}},
          e(StatsBar),
          e(SearchBar,{onSelect:handleSelect})
        ),
        tab==='chart'?e('div',null,
          e('div',{className:'card-bg rounded-xl p-4',style:{marginBottom:16}},
            e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
              e('div',null,
                e('div',{style:{fontSize:15,fontWeight:'700',color:'#e2e8f0'}},'小核酸靶点投资象限图'),
                e('div',{style:{fontSize:11,color:'#64748b',marginTop:2}},'横轴：同靶点在研管线数量　纵轴：靶点峰值市场规模（$B）　点击圆点查看详情')
              )
            ),
            e(ScatterPlot,{onSelect:handleSelect,selected:selected}),
            e(Legend)
          )
        ):e('div',null,
          e('div',{className:'card-bg rounded-xl p-4'},
            e('div',{style:{fontSize:15,fontWeight:'700',color:'#e2e8f0',marginBottom:12}},'在研管线全库'),
            e(TableView,{onSelect:handleSelect})
          )
        )
      ),
      panelOpen&&selected?e('div',{style:{width:420,flexShrink:0,borderLeft:'1px solid #1e293b',background:'#0d1117',overflowY:'auto',height:'100%'}},
        e(DetailPanel,{targetStats:selected,onClose:function(){setPanelOpen(false);setSelected(null);}})
      ):null
    ),
    e('div',{style:{padding:'8px 24px',borderTop:'1px solid #1e293b',display:'flex',alignItems:'center',justifyContent:'space-between'}},
      e('span',{style:{fontSize:11,color:'#334155'}},'数据仅供参考，不构成投资建议。市场数据为分析师预测，实际以公司公告为准。'),
      e('span',{style:{fontSize:11,color:'#334155'}},'© 2025 Small Nucleic Acid Pipeline DB')
    )
  );
}

// ============================================================
// ROOT — 密码门控
// ============================================================
function Root() {
  var _auth = useState(false); var authed = _auth[0]; var setAuthed = _auth[1];
  if (!authed) return e(LoginScreen, { onAuth: function(){ setAuthed(true); } });
  return e(App);
}

var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(Root));
</script>
